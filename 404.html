<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">

<title>Page not found · Drakiverse Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b0b0c'/%3E%3Crect x='22' y='22' width='14' height='56' rx='7' fill='%23c8ff2e'/%3E%3Crect x='42' y='22' width='14' height='56' rx='7' fill='%239d8cff'/%3E%3Crect x='62' y='22' width='14' height='56' rx='7' fill='%23ff8fc7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#0b0b0c;--fg:#fff1dc;--line:rgba(255,241,220,.14);--lime:#c8ff2e;--purple:#9d8cff;--pink:#ff8fc7;--orange:#ffa03a;--mint:#2EE6C8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
main{min-height:100svh;display:grid;place-items:center;padding:40px 20px}
.box{width:min(640px,100%)}
.label{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin:0}
.big{font:700 clamp(110px,28vw,220px)/.85 Syne,sans-serif;letter-spacing:-.06em;margin:14px 0 10px;display:flex;gap:.02em}
.big span{display:inline-block;animation:bob 2.8s cubic-bezier(.4,0,.2,1) infinite}
.big span:nth-child(1){color:var(--purple)}.big span:nth-child(2){color:var(--pink);animation-delay:.15s}.big span:nth-child(3){color:var(--orange);animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-10%) rotate(-3deg)}70%{transform:translateY(0)}}
h1{font:700 clamp(28px,5vw,40px)/1.1 Syne,sans-serif;letter-spacing:-.02em;margin:0 0 10px}
p.lead{margin:0 0 26px;font-size:17px;opacity:.8;max-width:42ch}
.btns{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600}
a.btn:hover,a.btn:focus-visible{border-color:var(--fg)}
a.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
a.btn i{width:10px;height:10px;border-radius:3px;margin-right:10px}
.bars{position:fixed;left:0;right:0;bottom:0;height:8px;display:flex}.bars i{flex:1}
@media (prefers-reduced-motion:reduce){.big span{animation:none}}
</style>
</head>
<body>
<main>
  <div class="box">
    <p class="label">Drakiverse Studio · Error 404</p>
    <div class="big" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
    <h1>This page wandered off.</h1>
    <p class="lead">The link might be old, or the page has moved. Here's where you can go instead.</p>
    <div class="btns">
      <a class="btn primary" href="/">Back to the studio</a>
      <a class="btn" href="/renvo/"><i style="background:var(--mint)"></i>Renvo</a>
      <a class="btn" href="/lastly/"><i style="background:var(--purple)"></i>Lastly</a>
      <a class="btn" href="/folderoo/"><i style="background:var(--orange)"></i>Folderoo</a>
    </div>
  </div>
</main>
<div class="bars" aria-hidden="true"><i style="background:var(--lime)"></i><i style="background:var(--purple)"></i><i style="background:var(--pink)"></i><i style="background:var(--orange)"></i></div>
</body>
</html>
